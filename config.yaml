# Fare Watch configuration. Edit, commit, and the next run picks it up.
origin: YYZ
# Chennai, Bengaluru, Mumbai, Kochi, Thiruvananthapuram, Kozhikode
destinations: [MAA, BLR, BOM, COK, TRV, CCJ]

passengers:
  adults: 2
  child_ages: [7, 2]      # both are 2-11, so both pay a child fare with their own seat

# "any" = every airline Google Flights sells (Air India, Turkish, KLM, Air France,
# Swiss, Saudia, Gulf Air, Kuwait, Ethiopian, SriLankan, Singapore, Cathay, US carriers...).
# "list" = only the carriers under `airlines`, on every segment.
airline_mode: any
airlines:                  # used for alert names and when airline_mode is "list"
  EY: Etihad
  EK: Emirates
  WY: Oman Air
  LH: Lufthansa
  BA: British Airways
  QR: Qatar Airways
  AC: Air Canada
exclude_airlines: []       # e.g. [PK, SV] to skip carriers you don't want (any mode only)

depart_window: {start: 2026-11-23, end: 2026-12-07}
return_window: {start: 2027-01-01, end: 2027-01-14}
# Each check covers every Nth date across the whole window and shifts the grid next time.
# 3 = 25 date pairs, about 56 searches per check. 2 = 56 pairs, about 118 searches.
date_step_days: 3

rules:
  max_leg_minutes: 2100          # 35 h, applied to each direction
  one_stop_min_layover: 360      # 6 h
  two_stop_min_layover: 240      # 4 h each
  max_stops: 2

search:
  currency: CAD
  country: ca
  outbound_candidates: 1   # cheapest valid outbounds per date pair to price a return for
  breakdown_top_n: 3       # itineraries per run that get a real adult/child fare split
  max_calls_per_run: 80    # hard stop to protect your SerpApi quota
  keep_results_hours: 720  # remember each itinerary's last price for 30 days (for "dropped" badges)

notify:                    # optional email/push; not used unless you add those secrets
  min_drop: 25             # CAD; only alert when the new low beats the old one by this much
  per_city_alerts: false   # true = also email when one city hits its own new low
  site_url: ""             # e.g. https://yourname.github.io/fare-watch/  (tap-through from alerts)
